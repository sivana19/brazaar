basePath: /
definitions:
  order.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/order.OrderItemRequest'
        type: array
    required:
    - items
    type: object
  order.OrderItemRequest:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for Bazaar e-commerce platform with Neon PostgreSQL, concurrency
    locks, and JWT auth.
  title: Bazaar E-Commerce API
  version: "1.0"
paths:
  /orders:
    post:
      consumes:
      - application/json
      description: Create an order with inventory validation and concurrency row locking
      parameters:
      - description: Order Items
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Get order details and items by order ID for the authenticated owner
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get order details
      tags:
      - orders
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
