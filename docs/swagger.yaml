basePath: /
definitions:
  cmd_api.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  cmd_api.ErrorResponse:
    properties:
      error:
        example: invalid request payload
        type: string
    type: object
  cmd_api.LoginRequest:
    properties:
      email:
        example: tester@bazaar.local
        type: string
      password:
        example: SecurePassword123!
        type: string
    required:
    - email
    - password
    type: object
  cmd_api.ProductInput:
    properties:
      description:
        example: Bluetooth 5.0, hot-swappable switches
        type: string
      name:
        example: Wireless Mechanical Keyboard
        type: string
      price_cents:
        example: 8500
        type: integer
      stock:
        example: 25
        minimum: 0
        type: integer
    required:
    - name
    - price_cents
    - stock
    type: object
  cmd_api.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        example: Bluetooth 5.0, hot-swappable switches
        type: string
      id:
        example: 7
        type: integer
      name:
        example: Wireless Mechanical Keyboard
        type: string
      price_cents:
        example: 8500
        type: integer
      stock:
        example: 25
        type: integer
      updated_at:
        type: string
    type: object
  cmd_api.RegisterRequest:
    properties:
      email:
        example: user@bazaar.local
        type: string
      full_name:
        example: Test User
        type: string
      password:
        example: SecurePassword123!
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  internal_order.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_order.OrderItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  internal_order.OrderItemRequest:
    properties:
      product_id:
        example: 11
        type: integer
      quantity:
        example: 2
        type: integer
    required:
    - product_id
    - quantity
    type: object
  internal_order.OrderItemResponse:
    properties:
      id:
        example: 101
        type: integer
      name:
        example: Ergonomic Mechanical Keyboard
        type: string
      price_cents:
        example: 11999
        type: integer
      product_id:
        example: 11
        type: integer
      quantity:
        example: 2
        type: integer
    type: object
  internal_order.OrderResponse:
    properties:
      created_at:
        type: string
      id:
        example: 1
        type: integer
      items:
        items:
          $ref: '#/definitions/internal_order.OrderItemResponse'
        type: array
      status:
        example: pending
        type: string
      total_cents:
        example: 23998
        type: integer
      updated_at:
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  internal_order.PaginatedOrdersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_order.OrderResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 24
        type: integer
    type: object
  internal_order.UpdateStatusRequest:
    properties:
      status:
        example: paid
        type: string
    required:
    - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance Go backend API for Bazaar platform featuring JWT auth,
    inventory management, and transactional order processing.
  title: Bazaar E-Commerce API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates credentials and issues signed JWT bearer token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/cmd_api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: Log in user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user profile with hashed password
      parameters:
      - description: Registration credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/cmd_api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /orders:
    get:
      description: Get paginated order history with line items for the authenticated
        user
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.PaginatedOrdersResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List user orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Places an order for items, deducting inventory via row-level locks
      parameters:
      - description: Order details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_order.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Insufficient inventory
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Returns single order details and its line items
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_order.OrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Transition order status (pending -> paid -> shipped -> delivered,
        or cancelled with inventory restocking)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_order.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid transition
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - orders
  /products:
    get:
      description: Fetches catalog of all available products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cmd_api.ProductResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: List all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Adds a new product to inventory (requires JWT auth)
      parameters:
      - description: Product attributes
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/cmd_api.ProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: Removes a product from catalog by ID (requires JWT auth)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      description: Fetches a single product record by its primary key
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: Get product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates attributes or stock of an existing product (requires JWT
        auth)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated product payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/cmd_api.ProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
