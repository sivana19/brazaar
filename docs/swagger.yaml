definitions:
  main.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  main.ErrorResponse:
    properties:
      error:
        example: invalid request payload
        type: string
    type: object
  main.LoginRequest:
    properties:
      email:
        example: tester@bazaar.local
        type: string
      password:
        example: SecurePassword123!
        type: string
    required:
    - email
    - password
    type: object
  main.ProductInput:
    properties:
      description:
        example: Bluetooth 5.0, hot-swappable switches
        type: string
      name:
        example: Wireless Mechanical Keyboard
        type: string
      price_cents:
        example: 8500
        type: integer
      stock:
        example: 25
        minimum: 0
        type: integer
    required:
    - name
    - price_cents
    - stock
    type: object
  main.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        example: Bluetooth 5.0, hot-swappable switches
        type: string
      id:
        example: 7
        type: integer
      name:
        example: Wireless Mechanical Keyboard
        type: string
      price_cents:
        example: 8500
        type: integer
      stock:
        example: 25
        type: integer
      updated_at:
        type: string
    type: object
  main.RegisterRequest:
    properties:
      email:
        example: user@bazaar.local
        type: string
      full_name:
        example: Abebe Bikila
        type: string
      password:
        example: SecurePassword123!
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates credentials and returns a Bearer JWT
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/main.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Log in user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new customer account
      parameters:
      - description: Registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /products:
    get:
      description: Retrieves all catalog items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ProductResponse'
            type: array
      summary: List all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Adds a new item to catalog (requires authentication)
      parameters:
      - description: Product attributes
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.ProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.ProductResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      description: Returns details and live inventory for a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ProductResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated product payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.ProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ProductResponse'
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
swagger: "2.0"
